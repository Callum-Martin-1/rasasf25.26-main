name: R

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.1.1"

      - name: Install packages
        run: |
          install.packages(c("tidyverse"))
        shell: Rscript {0}

      - name: Run script
        run: Rscript your_script.R